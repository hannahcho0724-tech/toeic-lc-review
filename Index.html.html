</style></head><body><main class="wrap"><section id="home"><div class="eyebrow">900+ 점수보장반 · 조해나 선생님</div><h1>LC 표현 복습</h1><p class="intro">교재를 고르고, 오늘 배운 표현을 다시 떠올려 보세요.<br>1000제 1 · TEST 01~10 · 수업별 표현 10개 · TEST별 문장 4개</p><div class="books"><button class="book primary" onclick="chooseBook('toeic1000_1')">1000제 1<small style="color:#eadff8">20회 수업 · 표현 200개 · 문장 40개</small></button><button class="book" onclick="chooseBook('toeic1000_2')">1000제 2<small>준비 중 · 별도 교재</small></button><button class="book" onclick="chooseBook('toeic_latest10')">최신기출실전10<small>준비 중 · 별도 교재</small></button></div><p id="pending" class="intro hidden" role="status"></p><div id="testgrid" class="testgrid"></div><div class="footer">교재명 + TEST + 진도로 자료를 구분합니다.<br>복습 체크는 현재 브라우저에만 저장됩니다. 점수·제출 기능은 포함하지 않습니다.</div></section><section id="viewer" class="hidden"><div class="toolbar"><button onclick="goHome()">교재·TEST 선택</button><select id="jump" aria-label="복습 회차 선택" onchange="jump(this.value)"></select><span id="count" class="counter" aria-live="polite"></span></div><article class="stage"><div id="meta" class="meta"></div><h2 id="expr" class="expr"></h2><div id="hint" class="hint">뜻을 떠올려 보세요.<br>같은 의미의 영어 표현도 말할 수 있나요?</div><div id="answer" class="answer hidden"><p id="meaning" class="meaning"></p><p id="syn" class="syn"></p><p id="note" class="note"></p><div id="source" class="source"></div></div></article><div class="controls"><button id="prev" onclick="move(-1)">이전</button><button id="reveal" class="primary" onclick="reveal()">뜻·유사표현 보기</button><button id="mark" onclick="mark()">복습 완료</button><button id="next" onclick="move(1)">다음</button></div><div class="footer">화살표: 이전·다음 / Space·Enter: 해설 보기 / Esc: 맵으로<br>한 번에 많이 외우기보다 짧게, 자주 복습하세요.</div></section></main><script>

, "meaning": "교육을 재개하다", "synonym": "restart / continue the training", "note": "resume은 동사로 재개하다. résumé는 이력서다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T01:P24:E04", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 4, "expression": "Lined up several interviews", "meaning": "여러 개의 면접 일정을 잡다", "synonym": "arrange / schedule several interviews", "note": "line up은 일정·준비를 잡는 뜻도 있다.", "sourceLabel": "Part 4 Q77–79"}, {"id": "toeic1000_1:T01:P24:E05", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 5, "expression": "Stream this live", "meaning": "이것을 생중계하다", "synonym": "broadcast this live online", "note": "stream은 동영상·음성 전송. live는 여기서 생방송이다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T01:P24:E06", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 6, "expression": "No obligation to purchase", "meaning": "구매 의무가 없는", "synonym": "You do not have to buy anything.", "note": "obligation은 의무. 무료 체험 뒤 구매가 필수라는 뜻이 아니다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T01:P24:E07", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 7, "expression": "Complimentary activities", "meaning": "무료 활동들", "synonym": "free activities / activities at no charge", "note": "complimentary는 무료의. complementary는 보완하는이다.", "sourceLabel": "Part 4 Q95–97"}, {"id": "toeic1000_1:T01:P24:E08", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 8, "expression": "Dispatch a technician", "meaning": "기술자를 급파하다", "synonym": "send a technician to the site", "note": "dispatch는 사람·차량 등을 보내다. 수리 완료를 뜻하지 않는다.", "sourceLabel": "Part 4 Q98–100"}, {"id": "toeic1000_1:T01:P24:E09", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 9, "expression": "Due to severe weather", "meaning": "악천후 때문에", "synonym": "because of bad weather", "note": "due to는 원인. be due는 예정·마감이다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T01:P24:E10", "bookId": "toeic1000_1", "test": 1, "day": 2, "part": 4, "number": 10, "expression": "On behalf of the airline", "meaning": "항공사를 대표하여", "synonym": "representing the airline", "note": "on behalf of는 대표하여·대신하여. 화자의 소속을 확인한다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T02:P13:E01", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 1, "expression": "Have a courier stop by", "meaning": "배달 기사를 들르게 하다", "synonym": "arrange for a courier to visit", "note": "have + 사람 + 동사원형. 목적어가 행동하는 구조다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T02:P13:E02", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 2, "expression": "Show (someone) around", "meaning": "~에게 (시설 등을) 구경시켜 주다", "synonym": "give someone a tour", "note": "show around는 시설을 안내하며 둘러보게 하는 덩어리다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T02:P13:E03", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 3, "expression": "Stay on the line", "meaning": "전화를 끊지 않고 기다리다", "synonym": "hold / do not hang up", "note": "line은 전화 연결을 뜻한다. 줄을 서라는 뜻이 아니다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T02:P13:E04", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 4, "expression": "Bring it up to management", "meaning": "경영진에게 안건을 제기하다", "synonym": "raise the issue with management", "note": "bring up은 안건·문제를 꺼내다. 들어 올리다와 구분한다.", "sourceLabel": "Part 3 Q44–46"}, {"id": "toeic1000_1:T02:P13:E05", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 5, "expression": "Unexpectedly broke down", "meaning": "예기치 않게 고장 났다", "synonym": "stopped working unexpectedly", "note": "break down은 기계 고장. 분석·분해 뜻도 문맥에 따라 가능하다.", "sourceLabel": "Part 3 Q50–52"}, {"id": "toeic1000_1:T02:P13:E06", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 6, "expression": "At no extra charge", "meaning": "추가 비용 없이", "synonym": "without an additional fee", "note": "추가 비용이 없다는 뜻. 기본 서비스 전체가 무료인지는 별도다.", "sourceLabel": "Part 3 Q50–52"}, {"id": "toeic1000_1:T02:P13:E07", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 7, "expression": "Still within our warranty period", "meaning": "아직 품질 보증 기간 내에 있는", "synonym": "still covered by the warranty", "note": "within은 기간 안. 보증 기간이 이미 끝났다는 뜻이 아니다.", "sourceLabel": "Part 3 Q53–55"}, {"id": "toeic1000_1:T02:P13:E08", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 8, "expression": "Publicize this event", "meaning": "이 이벤트를 홍보하다", "synonym": "promote / advertise this event", "note": "publicize는 사람들에게 알리다. 공개·홍보의 문맥이다.", "sourceLabel": "Part 3 Q68–70"}, {"id": "toeic1000_1:T02:P13:E09", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 9, "expression": "Pick up my clothes", "meaning": "내 옷을 찾으러 오다", "synonym": "collect my clothes", "note": "pick up은 세탁한 옷을 찾다. 배달·직접 수령을 구분한다.", "sourceLabel": "Part 3 Q50–52"}, {"id": "toeic1000_1:T02:P13:E10", "bookId": "toeic1000_1", "test": 2, "day": 3, "part": 3, "number": 10, "expression": "Check on the status of...", "meaning": "~의 상태(진행 상황)를 확인하다", "synonym": "find out how... is progressing", "note": "status는 상태·진행 상황. 사회적 지위라는 뜻도 있다.", "sourceLabel": "Part 3 Q59–61"}, {"id": "toeic1000_1:T02:P24:E01", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 1, "expression": "Fully booked", "meaning": "예약이 꽉 찬", "synonym": "no reservations available", "note": "booked는 예약된. fully booked는 예약이 모두 찼다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T02:P24:E02", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 2, "expression": "Prior to boarding", "meaning": "탑승하기 전에", "synonym": "before boarding", "note": "prior to 뒤에는 명사 또는 동명사가 온다.", "sourceLabel": "Part 4 Q71–73"}, {"id": "toeic1000_1:T02:P24:E03", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 3, "expression": "Opening address", "meaning": "개회사 / 개회 연설", "synonym": "opening speech / introductory remarks", "note": "address는 명사로 연설. 주소라는 뜻과 구분한다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T02:P24:E04", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 4, "expression": "Run into a small problem", "meaning": "작은 문제에 직면하다", "synonym": "encounter a minor problem", "note": "run into는 우연히 만나다·문제에 직면하다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T02:P24:E05", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 5, "expression": "Increase awareness of...", "meaning": "~에 대한 인지도를 높이다", "synonym": "raise recognition of...", "note": "awareness는 인지도·인식. 매출 증가와 같은 결과는 아니다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T02:P24:E06", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 6, "expression": "Biannual meeting", "meaning": "연 2회(반기별) 회의", "synonym": "a meeting held twice a year", "note": "biannual은 연 2회. biennial은 2년에 한 번이다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T02:P24:E07", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 7, "expression": "Large turnout is anticipated", "meaning": "많은 인원이 참석할 것으로 예상되다", "synonym": "many people are expected to attend", "note": "turnout은 참석 인원. anticipated는 예상되는이다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T02:P24:E08", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 8, "expression": "Big round of applause", "meaning": "큰 박수", "synonym": "a big round of clapping", "note": "round는 한 차례의 박수. 원형이라는 뜻으로 읽지 않는다.", "sourceLabel": "Part 4 Q95–97"}, {"id": "toeic1000_1:T02:P24:E09", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 9, "expression": "Play a key role in...", "meaning": "~에서 핵심적인 역할을 하다", "synonym": "be important in...", "note": "play a key role in + 명사·동명사. key는 핵심적인이라는 뜻이다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T02:P24:E10", "bookId": "toeic1000_1", "test": 2, "day": 4, "part": 4, "number": 10, "expression": "Take place at...", "meaning": "~에서 열리다", "synonym": "be held at...", "note": "take place는 개최되다. 개최 장소를 at으로 연결한다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T03:P13:E01", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 1, "expression": "Could use your advice", "meaning": "네 조언이 좀 필요해", "synonym": "I would appreciate your advice.", "note": "could use는 있으면 도움이 된다·필요하다는 구어 표현이다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T03:P13:E02", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 2, "expression": "Look into that", "meaning": "그것을 알아보다/조사하다", "synonym": "investigate / check that", "note": "look into는 조사하다. 물리적으로 안을 들여다보는 뜻도 있다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T03:P13:E03", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 3, "expression": "Do you know his extension?", "meaning": "그분의 내선 번호를 아세요?", "synonym": "Do you know his internal phone number?", "note": "extension은 내선 번호. 기한 연장 뜻과 구분한다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T03:P13:E04", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 4, "expression": "Review the contract", "meaning": "계약서를 검토하다", "synonym": "examine / look over the contract", "note": "review는 검토하다. 계약 협상 negotiate와 구분한다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T03:P13:E05", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 5, "expression": "Have it fixed", "meaning": "그것을 수리하게 시키다", "synonym": "arrange for it to be repaired", "note": "have + 사물 + 과거분사. 직접 수리했다는 뜻은 아니다.", "sourceLabel": "Part 3 Q44–46"}, {"id": "toeic1000_1:T03:P13:E06", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 6, "expression": "Halt the shipment", "meaning": "배송을 중단시키다", "synonym": "stop / suspend the shipment", "note": "halt는 중단하다. 배송 완료와 반대되는 행동이다.", "sourceLabel": "Part 3 Q47–49"}, {"id": "toeic1000_1:T03:P13:E07", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 7, "expression": "A promotional event we’re running", "meaning": "우리가 진행 중인 홍보 행사", "synonym": "a promotional event we are conducting", "note": "run은 행사·사업을 운영하다. 달리다로 해석하지 않는다.", "sourceLabel": "Part 3 Q50–52"}, {"id": "toeic1000_1:T03:P13:E08", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 8, "expression": "Sign up for (a seminar)", "meaning": "(세미나에) 등록하다", "synonym": "register for a seminar", "note": "sign up for + 행사. sign은 서명하다라는 뜻도 있다.", "sourceLabel": "Part 3 Q53–55"}, {"id": "toeic1000_1:T03:P13:E09", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 9, "expression": "In charge of that", "meaning": "그것을 담당하고 있는", "synonym": "responsible for that", "note": "in charge of는 담당. charge a fee는 요금을 부과하다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T03:P13:E10", "bookId": "toeic1000_1", "test": 3, "day": 5, "part": 3, "number": 10, "expression": "Misunderstood your instructions", "meaning": "지시 사항을 오해하다", "synonym": "did not understand the directions correctly", "note": "instructions는 지시 사항·사용법. misunderstand는 오해하다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T03:P24:E01", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 1, "expression": "Torn during transit", "meaning": "운송 중에 찢어지다", "synonym": "ripped while being transported", "note": "transit은 운송·이동 중. 배송 후 파손인지 구분한다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T03:P24:E02", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 2, "expression": "Dealing with the matter", "meaning": "문제를 처리하다", "synonym": "handling / addressing the issue", "note": "matter는 문제·사안. 동사로는 중요하다의 뜻도 있다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T03:P24:E03", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 3, "expression": "Make other arrangements", "meaning": "다른 준비(계획)를 하다", "synonym": "arrange an alternative plan", "note": "arrangements는 준비·계획. 꽃 장식 뜻도 문맥에 따라 있다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T03:P24:E04", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 4, "expression": "Mark down everything", "meaning": "모든 품목을 할인하다", "synonym": "discount all the items", "note": "mark down은 가격 인하. mark up은 가격 인상이다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T03:P24:E05", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 5, "expression": "Complimentary piece of jewelry", "meaning": "무료 보석류(사은품)", "synonym": "a free piece of jewelry", "note": "complimentary는 무료 제공. 품질이 좋다는 뜻 자체는 아니다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T03:P24:E06", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 6, "expression": "Product availability is limited", "meaning": "제품 수량이 한정되어 있다", "synonym": "only a limited quantity is available", "note": "limited는 제한된. 품절과는 다르다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T03:P24:E07", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 7, "expression": "Carrying out some research", "meaning": "조사를 실시하다", "synonym": "conduct / perform research", "note": "carry out은 수행하다. 물건을 밖으로 운반한다는 뜻도 있다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T03:P24:E08", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 8, "expression": "Buy in bulk", "meaning": "대량으로 구매하다", "synonym": "purchase large quantities", "note": "in bulk는 대량으로. 할인 여부는 문맥에서 확인한다.", "sourceLabel": "Part 4 Q98–100"}, {"id": "toeic1000_1:T03:P24:E09", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 9, "expression": "Spend money on a rental", "meaning": "렌터카에 돈을 쓰다", "synonym": "pay for a rental vehicle", "note": "rental은 대여·임대. 이 문맥은 렌터카 비용이다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T03:P24:E10", "bookId": "toeic1000_1", "test": 3, "day": 6, "part": 4, "number": 10, "expression": "Take part in each competition", "meaning": "각 대회에 참가하다", "synonym": "participate in each competition", "note": "take part in은 참가하다. take place는 개최되다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T04:P13:E01", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 1, "expression": "Qualify for a loan", "meaning": "대출 자격이 되다", "synonym": "be eligible for a loan", "note": "qualify for는 자격을 충족하다. 대출 승인 완료와 구분한다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T04:P13:E02", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 2, "expression": "At her earliest convenience", "meaning": "그녀가 편리한 가장 이른 시간에", "synonym": "as soon as it is convenient for her", "note": "상대가 편리한 가장 이른 시점. 즉시 하라는 강제 명령은 아니다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T04:P13:E03", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 3, "expression": "Addressing e-mail system issues", "meaning": "이메일 시스템 문제를 처리하는 중", "synonym": "dealing with e-mail system problems", "note": "address는 문제를 다루다. 해결 완료까지 보장하지 않는다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T04:P13:E04", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 4, "expression": "Running low (on ink)", "meaning": "(잉크가) 떨어져 가다", "synonym": "have little ink left", "note": "run low on은 거의 떨어져 가다. run out of는 다 떨어지다.", "sourceLabel": "Part 3 Q53–55"}, {"id": "toeic1000_1:T04:P13:E05", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 5, "expression": "Get this brown stain out", "meaning": "이 갈색 얼룩을 빼다", "synonym": "remove this brown stain", "note": "get + 얼룩 + out은 얼룩을 제거하는 덩어리다.", "sourceLabel": "Part 3 Q59–61"}, {"id": "toeic1000_1:T04:P13:E06", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 6, "expression": "Forward you the résumés", "meaning": "당신에게 이력서를 전달하다", "synonym": "send you the résumés / pass them on", "note": "forward는 전달하다. résumé의 악센트와 뜻을 확인한다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T04:P13:E07", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 7, "expression": "Valid for one day", "meaning": "하루 동안 유효한", "synonym": "effective for one day", "note": "valid는 유효한. available은 이용 가능한이다.", "sourceLabel": "Part 3 Q65–67"}, {"id": "toeic1000_1:T04:P13:E08", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 8, "expression": "Tap it on the sensor", "meaning": "센서에 (카드를) 대다(찍다)", "synonym": "touch it to the sensor", "note": "tap은 가볍게 대다·두드리다. 수도꼭지 뜻도 있다.", "sourceLabel": "Part 3 Q65–67"}, {"id": "toeic1000_1:T04:P13:E09", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 9, "expression": "Won’t turn on", "meaning": "(기기가) 켜지지 않는다", "synonym": "will not start / power on", "note": "turn on은 기기를 켜다. won't는 작동 불가 상태를 나타낼 수 있다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T04:P13:E10", "bookId": "toeic1000_1", "test": 4, "day": 7, "part": 3, "number": 10, "expression": "Take off the plastic strip", "meaning": "플라스틱 띠를 제거하다", "synonym": "remove the plastic strip", "note": "take off는 제거하다·벗다. 비행기 문맥에서는 이륙하다.", "sourceLabel": "Part 3 Q53–55"}, {"id": "toeic1000_1:T04:P24:E01", "bookId": "toeic1000_1", "test": 4, "day": 8, "part": 4, "number": 1, "expression": "Accept this award on his behalf", "meaning": "그를 대신하여 이 상을 받다", "synonym": "receive the award in his place", "note": "on behalf of는 대신하여·대표하여. 실제 수상자와 대리인을 구분한다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T04:P24:E02", "bookId": "toeic1000_1", "test": 4, "day": 8, "part": 4, "number": 2, "expression": "Recipient of the medal", "meaning": "메달 수령자(수상자)", "synonym": "the person receiving the medal", "note": "recipient는 수령자·수상자. 주는 사람과 반대다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T04:P24:E03", "bookId": "toeic1000_1", "test": 4, "day": 8, "part": 4, "number": 3, "expression": "Unless instructed otherwise", "meaning": "별도의 지시가 없는 한", "synonym": "except when given different instructions", "note": "unless는 ~하지 않는 한. otherwise는 다르게·그렇지 않으면이다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T04:P24:E04", "bookId": "toeic1000_1", "test": 4, "day": 8, "part": 4, "number": 4, "expression": "Stress the importance of...", "meaning": "~의 중요성을 강조하다", "synonym": "emphasize the importance of...", "note": "stress는 강조하다. 압박 get", "meaning": "예산 승인을 받다", "synonym": "have the budget authorized", "note": "approval은 승인. 신청·논의와 완료 상태를 구분한다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T06:P13:E09", "bookId": "toeic1000_1", "test": 6, "day": 11, "part": 3, "number": 9, "expression": "Meant to do that", "meaning": "그러려고 했다 / 할 생각이었다", "synonym": "intended to do that", "note": "meant to는 의도·계획. 실제로 수행했는지는 뒤 문맥에서 확인한다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T06:P13:E10", "bookId": "toeic1000_1", "test": 6, "day": 11, "part": 3, "number": 10, "expression": "Postpone the marathon", "meaning": "마라톤을 연기하다", "synonym": "put off / delay the marathon", "note": "postpone은 연기. cancel은 취소이다.", "sourceLabel": "Part 3 Q56–58"}, {"id": "toeic1000_1:T06:P24:E01", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 1, "expression": "Take advantage of our sale", "meaning": "저희 세일 기회를 활용하세요", "synonym": "make use of the sale", "note": "take advantage of는 기회·혜택을 활용하다.", "sourceLabel": "Part 4 Q71–73"}, {"id": "toeic1000_1:T06:P24:E02", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 2, "expression": "Voucher good for any future purchase", "meaning": "향후 구매 시 사용 가능한 쿠폰", "synonym": "a voucher valid for a future purchase", "note": "good for는 쿠폰에 쓰이면 ~에 유효한·사용 가능한 뜻이다.", "sourceLabel": "Part 4 Q71–73"}, {"id": "toeic1000_1:T06:P24:E03", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 3, "expression": "Permanent product line", "meaning": "정규 제품군", "synonym": "a regular / ongoing product range", "note": "product line은 제품군. 줄·전화선과 구분한다.", "sourceLabel": "Part 4 Q77–79"}, {"id": "toeic1000_1:T06:P24:E04", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 4, "expression": "Room for improvement", "meaning": "개선의 여지", "synonym": "scope for improvement", "note": "room은 여지·공간. 방 한 칸만 뜻하지 않는다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T06:P24:E05", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 5, "expression": "Follow them closely", "meaning": "그것들을 엄격히 따르다", "synonym": "comply with the guidelines carefully", "note": "closely는 주의 깊게·엄격히. 거리만 나타내지 않는다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T06:P24:E06", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 6, "expression": "File your annual taxes", "meaning": "연간 세금 신고서를 제출하다", "synonym": "submit your annual tax return", "note": "file은 신고·제출하다. 파일·서류철 뜻과 구분한다.", "sourceLabel": "Part 4 Q86–88"}, {"id": "toeic1000_1:T06:P24:E07", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 7, "expression": "Floral arrangements", "meaning": "꽃 장식(어레인지먼트)", "synonym": "flower decorations / bouquets", "note": "arrangements는 꽃 장식. 일정·준비 뜻도 있다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T06:P24:E08", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 8, "expression": "Water conservation", "meaning": "물 절약 / 수자원 보전", "synonym": "saving water / reducing water use", "note": "water conservation은 물 절약·보전. 수질 개선과는 구분한다.", "sourceLabel": "Part 4 Q98–100"}, {"id": "toeic1000_1:T06:P24:E09", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 9, "expression": "Marked down", "meaning": "가격이 인하된(할인된)", "synonym": "discounted / reduced in price", "note": "mark down은 가격 인하. write down은 적다이다.", "sourceLabel": "Part 4 Q71–73"}, {"id": "toeic1000_1:T06:P24:E10", "bookId": "toeic1000_1", "test": 6, "day": 12, "part": 4, "number": 10, "expression": "Track your expenses", "meaning": "지출을 추적(기록)하다", "synonym": "monitor / record your spending", "note": "expenses는 지출·경비. 비용의 기록과 환급은 다른 행동이다.", "sourceLabel": "Part 4 Q86–88"}, {"id": "toeic1000_1:T07:P13:E01", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 1, "expression": "Domestically produced goods", "meaning": "국산품 (국내 생산 제품)", "synonym": "goods made in this country", "note": "domestically는 국내에서. domestic은 가정의 뜻도 있다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T07:P13:E02", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 2, "expression": "Switching back to...", "meaning": "~로 다시 바꾸다(복귀하다)", "synonym": "returning to the previous provider", "note": "switch back은 이전 선택으로 돌아가다.", "sourceLabel": "Part 3 Q35–37"}, {"id": "toeic1000_1:T07:P13:E03", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 3, "expression": "Line of freshly made sandwiches", "meaning": "즉석 제조 샌드위치 제품군", "synonym": "a range of freshly made sandwiches", "note": "line은 제품군. 줄을 서는 상황과 구분한다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T07:P13:E04", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 4, "expression": "Give out samples", "meaning": "샘플을 나눠주다", "synonym": "distribute samples / hand samples out", "note": "give out은 배포하다. 기계가 멈추다·소진되다 뜻도 있다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T07:P13:E05", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 5, "expression": "Worn out", "meaning": "(옷 등이) 낡아서 해진", "synonym": "old and damaged / exhausted", "note": "물건이면 낡아 해진, 사람이면 지친 뜻이다.", "sourceLabel": "Part 3 Q47–49"}, {"id": "toeic1000_1:T07:P13:E06", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 6, "expression": "Charge it to this credit card", "meaning": "이 신용카드로 결제하다", "synonym": "pay for it with this credit card", "note": "charge는 카드에 비용을 청구하다. 충전하다와 구분한다.", "sourceLabel": "Part 3 Q47–49"}, {"id": "toeic1000_1:T07:P13:E07", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 7, "expression": "Pick it up myself", "meaning": "직접 찾으러 가다", "synonym": "collect it in person", "note": "pick up은 직접 수령하다. 들어 올리다·태워주다 뜻도 있다.", "sourceLabel": "Part 3 Q59–61"}, {"id": "toeic1000_1:T07:P13:E08", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 8, "expression": "Still settling in", "meaning": "여전히 적응 중인", "synonym": "still getting used to the new workplace", "note": "settle in은 새로운 환경에 적응하다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T07:P13:E09", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 9, "expression": "Contact staffing services", "meaning": "인력 파견 업체에 연락하다", "synonym": "get in touch with employment agencies", "note": "staffing services는 인력 공급·채용 서비스. 지원자와 기관을 구분한다.", "sourceLabel": "Part 3 Q56–58"}, {"id": "toeic1000_1:T07:P13:E10", "bookId": "toeic1000_1", "test": 7, "day": 13, "part": 3, "number": 10, "expression": "Fills up quickly", "meaning": "금방 자리가 차다", "synonym": "becomes fully booked quickly", "note": "fill up은 자리가 차다. 이미 예약 완료인지 진행 중인지 구분한다.", "sourceLabel": "Part 3 Q68–70"}, {"id": "toeic1000_1:T07:P24:E01", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 1, "expression": "Sample the menu items", "meaning": "메뉴 품목을 시식하다", "synonym": "taste the dishes", "note": "sample은 동사로 시식·시험하다. 명사로 견본이다.", "sourceLabel": "Part 4 Q71–73"}, {"id": "toeic1000_1:T07:P24:E02", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 2, "expression": "Safety and liability reasons", "meaning": "안전 및 법적 책임 사유", "synonym": "because of safety and legal responsibility", "note": "liability는 법적 책임. 회계 문맥에서는 부채다.", "sourceLabel": "Part 4 Q74–76"}, {"id": "toeic1000_1:T07:P24:E03", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 3, "expression": "Reimburse you in cash", "meaning": "현금으로 환급해 주다", "synonym": "pay you back in cash", "note": "reimburse는 대신 지출한 돈을 돌려주다. 비용 보전 문맥이다.", "sourceLabel": "Part 4 Q80–82"}, {"id": "toeic1000_1:T07:P24:E04", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 4, "expression": "Allocate $2 million", "meaning": "200만 달러를 할당하다", "synonym": "set aside / assign $2 million", "note": "allocate는 예산·자원을 배정하다.", "sourceLabel": "Part 4 Q86–88"}, {"id": "toeic1000_1:T07:P24:E05", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 5, "expression": "Fixed timeline regarding...", "meaning": "~에 관한 확정된 일정", "synonym": "a confirmed schedule for...", "note": "fixed timeline은 확정된 일정. no가 앞에 오면 아직 일정 미확정이다.", "sourceLabel": "Part 4 Q86–88"}, {"id": "toeic1000_1:T07:P24:E06", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 6, "expression": "Record sales numbers", "meaning": "기록적인 판매 수치", "synonym": "the highest sales figures achieved", "note": "record는 이 문맥에서 기록적인. 기록하다와 구분한다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T07:P24:E07", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 7, "expression": "Drop the model", "meaning": "모델(생산)을 중단하다", "synonym": "discontinue the model", "note": "drop은 제품 생산·취급을 중단하다. 떨어뜨리다로만 읽지 않는다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T07:P24:E08", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 8, "expression": "Coincide with the release", "meaning": "출시와 시기가 겹치다 / 일치하다", "synonym": "happen at the same time as the release", "note": "coincide with는 시기가 일치하다. 원문만으로 의도적 조정은 확정 못 한다.", "sourceLabel": "Part 4 Q95–97"}, {"id": "toeic1000_1:T07:P24:E09", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 9, "expression": "Underperforming", "meaning": "실적이 저조한", "synonym": "performing below expectations", "note": "underperform은 기대에 못 미치다. record sales와 대비한다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T07:P24:E10", "bookId": "toeic1000_1", "test": 7, "day": 14, "part": 4, "number": 10, "expression": "Engaged and communicative", "meaning": "몰입하고 소통하는", "synonym": "actively involved and willing to communicate", "note": "engaged는 참여·몰입한. 약혼한·사용 중인 뜻도 있다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T08:P13:E01", "bookId": "toeic1000_1", "test": 8, "day": 15, "part": 3, "number": 1, "expression": "Underperforming", "meaning": "실적이 저조한", "synonym": "performing below expectations", "note": "underperform은 기대 수준에 못 미치다.", "sourceLabel": "Part 3 Q32–34"}, {"id": "toeic1000_1:T08:P13:E02", "bookId": "toeic1000_1", "test": 8, "day": 15, "part": 3, "number": 2, "expression": "Raise awarenes 00_1", "test": 10, "day": 19, "part": 3, "number": 3, "expression": "Postponing isn’t an option", "meaning": "연기는 선택 사항이 아니다(불가능하다)", "synonym": "We cannot postpone it.", "note": "isn't an option은 가능한 선택이 아니라는 뜻이다.", "sourceLabel": "Part 3 Q38–40"}, {"id": "toeic1000_1:T10:P13:E04", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 4, "expression": "Charge a flat rate", "meaning": "고정 요금을 부과하다", "synonym": "apply a fixed charge", "note": "flat rate는 고정·균일 요금. 모든 서비스 무료라는 뜻이 아니다.", "sourceLabel": "Part 3 Q41–43"}, {"id": "toeic1000_1:T10:P13:E05", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 5, "expression": "Promising market", "meaning": "유망한 시장", "synonym": "a market with good growth potential", "note": "promising은 유망한. 약속 중이라는 뜻으로 읽지 않는다.", "sourceLabel": "Part 3 Q44–46"}, {"id": "toeic1000_1:T10:P13:E06", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 6, "expression": "Get a quote ready", "meaning": "견적서를 준비하다", "synonym": "prepare a price estimate", "note": "quote는 견적. 인용문이라는 뜻과 구분한다.", "sourceLabel": "Part 3 Q53–55"}, {"id": "toeic1000_1:T10:P13:E07", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 7, "expression": "Can’t afford to build", "meaning": "건물을 지을 여유가 없다", "synonym": "cannot pay for construction", "note": "can't afford to는 비용·상황상 여유가 없음을 뜻한다.", "sourceLabel": "Part 3 Q59–61"}, {"id": "toeic1000_1:T10:P13:E08", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 8, "expression": "Expanded its guest list", "meaning": "하객(손님) 명단을 늘리다", "synonym": "added more guests to the list", "note": "expand는 늘리다·확장하다. 명단 인원 증가를 듣는다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T10:P13:E09", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 9, "expression": "Misheard the last digit", "meaning": "마지막 숫자를 잘못 듣다", "synonym": "heard the final number incorrectly", "note": "digit는 숫자 한 자리. 전체 번호 number와 구분한다.", "sourceLabel": "Part 3 Q47–49"}, {"id": "toeic1000_1:T10:P13:E10", "bookId": "toeic1000_1", "test": 10, "day": 19, "part": 3, "number": 10, "expression": "Easy access to the stage", "meaning": "무대로의 쉬운 접근", "synonym": "a convenient way to reach the stage", "note": "access는 접근·출입. 접근성이 좋은 좌석이라는 문맥이다.", "sourceLabel": "Part 3 Q62–64"}, {"id": "toeic1000_1:T10:P24:E01", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 1, "expression": "Overseen PR firms", "meaning": "홍보 대행사를 총괄해왔다", "synonym": "supervised / managed PR firms", "note": "oversee는 총괄하다. oversight는 감독 또는 실수라는 뜻도 있다.", "sourceLabel": "Part 4 Q77–79"}, {"id": "toeic1000_1:T10:P24:E02", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 2, "expression": "Never-before-seen footage", "meaning": "미공개 영상", "synonym": "previously unreleased video material", "note": "footage는 영상 자료. 발 foot와 직역해서 연결하지 않는다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T10:P24:E03", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 3, "expression": "Advocates for the protection", "meaning": "보호를 옹호(주장)하다", "synonym": "supports / argues for protection", "note": "advocate는 지지·옹호하다. 명사로 옹호자이다.", "sourceLabel": "Part 4 Q83–85"}, {"id": "toeic1000_1:T10:P24:E04", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 4, "expression": "Out of service", "meaning": "사용할 수 없는 / 운행이 중단된", "synonym": "not available for use / not operating", "note": "out of service는 사용·운행 중단. out of stock은 품절이다.", "sourceLabel": "Part 4 Q86–88"}, {"id": "toeic1000_1:T10:P24:E05", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 5, "expression": "Stands out", "meaning": "두드러지다(눈에 띄다)", "synonym": "is noticeable / is distinctive", "note": "stand out은 두드러지다. 서 있다라는 뜻만 떠올리지 않는다.", "sourceLabel": "Part 4 Q89–91"}, {"id": "toeic1000_1:T10:P24:E06", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 6, "expression": "Hits stores early this May", "meaning": "5월 초에 매장에 출시되다", "synonym": "becomes available in stores in early May", "note": "hit stores는 매장에 출시되다. 때리다로 해석하지 않는다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T10:P24:E07", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 7, "expression": "Unexpectedly high volume of requests", "meaning": "예상치 못하게 많은 요청(주문)", "synonym": "an unexpectedly large number of requests", "note": "volume은 양·규모. 음량 뜻과 구분한다.", "sourceLabel": "Part 4 Q92–94"}, {"id": "toeic1000_1:T10:P24:E08", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 8, "expression": "Unauthorized person", "meaning": "권한이 없는 사람(타인)", "synonym": "someone without permission", "note": "unauthorized는 허가·권한이 없는. 카드 도용 문맥을 본다.", "sourceLabel": "Part 4 Q98–100"}, {"id": "toeic1000_1:T10:P24:E09", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 9, "expression": "Debit card may have been used", "meaning": "직불카드가 사용되었을 수 있다", "synonym": "the debit card was possibly used", "note": "may have + 과거분사는 과거에 그랬을 가능성. 도용이 확정됐다는 뜻은 아니다.", "sourceLabel": "Part 4 Q98–100"}, {"id": "toeic1000_1:T10:P24:E10", "bookId": "toeic1000_1", "test": 10, "day": 20, "part": 4, "number": 10, "expression": "Discuss the matter further", "meaning": "사안을 추가로 논의하다", "synonym": "talk more about the issue", "note": "further는 추가로·더. matter는 사안이다.", "sourceLabel": "Part 4 Q98–100"}], "sentences": [{"test": 1, "part": 3, "sentence": "I’ll call some of our workers who are off today to see if anyone can come in on short notice.", "ref": "Part 3 Q53–55", "meaning": "오늘 쉬는 직원 몇 명에게 전화해서 촉박한 연락에도 나올 수 있는 사람이 있는지 알아볼게요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T01:S01"}, {"test": 1, "part": 3, "sentence": "I’m moving out of my house next month, and I was wondering if I could transfer my cable account to my roommate.", "ref": "Part 3 Q35–37", "meaning": "다음 달에 집에서 이사 나가는데, 제 케이블 계정을 룸메이트에게 이전할 수 있는지 여쭤보고 싶었어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T01:S02"}, {"test": 1, "part": 4, "sentence": "We’re running a little behind schedule, so let’s begin.", "ref": "Part 4 Q74–76", "meaning": "일정이 조금 늦어지고 있으니 시작하겠습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T01:S03"}, {"test": 1, "part": 4, "sentence": "Thanks to your efforts, I have lined up several interviews in the coming week.", "ref": "Part 4 Q77–79", "meaning": "여러분의 노력 덕분에 다음 주에 면접을 여러 건 잡았습니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T01:S04"}, {"test": 2, "part": 3, "sentence": "I’ll have a courier stop by your place and pick it up tomorrow morning.", "ref": "Part 3 Q32–34", "meaning": "내일 아침 배달 기사가 댁에 들러 그것을 수거하게 하겠습니다.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T02:S01"}, {"test": 2, "part": 3, "sentence": "By the way, Steve, would you be able to show Edward around the laboratory at some point today?", "ref": "Part 3 Q35–37", "meaning": "그런데 스티브, 오늘 중에 에드워드에게 실험실을 안내해 줄 수 있나요?", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T02:S02"}, {"test": 2, "part": 4, "sentence": "We are fully booked until the end of August.", "ref": "Part 4 Q80–82", "meaning": "8월 말까지 예약이 모두 찼습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T02:S03"}, {"test": 2, "part": 4, "sentence": "Also, if anyone is willing to check their bag prior to boarding, please see airline agents at the ticketing desk.", "ref": "Part 4 Q71–73", "meaning": "또한 탑승 전에 가방을 위탁할 의향이 있는 분은 발권 데스크의 항공사 직원에게 문의해 주세요.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T02:S04"}, {"test": 3, "part": 3, "sentence": "I’m really looking forward to it, but I could use your advice about something related to my trip.", "ref": "Part 3 Q32–34", "meaning": "정말 기대하고 있지만, 여행과 관련해 조언을 좀 구하고 싶어요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T03:S01"}, {"test": 3, "part": 3, "sentence": "I heard that our manager wants to review the contract on June 2.", "ref": "Part 3 Q38–40", "meaning": "관리자가 6월 2일에 계약서를 검토하고 싶어 한다고 들었어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T03:S02"}, {"test": 3, "part": 4, "sentence": "However, the item’s box seems to have been torn during transit, leaving a long scratch across the screen.", "ref": "Part 4 Q74–76", "meaning": "그런데 제품 상자가 운송 중 찢어져서 화면에 길게 흠집이 난 것 같습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T03:S03"}, {"test": 3, "part": 4, "sentence": "Either way, let me know sometime today in case I need to make other arrangements.", "ref": "Part 4 Q80–82", "meaning": "다른 준비를 해야 할 수도 있으니, 어느 쪽이든 오늘 중에 알려 주세요.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T03:S04"}, {"test": 4, "part": 3, "sentence": "Oh, that’s not a problem as long as you can get this brown stain out.", "ref": "Part 3 Q59–61", "meaning": "이 갈색 얼룩만 제거해 주실 수 있다면 괜찮아요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T04:S01"}, {"test": 4, "part": 3, "sentence": "Although we qualify for a loan, the amount will only cover about half of our estimated costs.", "ref": "Part 3 Q32–34", "meaning": "대출 자격은 되지만, 그 금액으로는 예상 비용의 절반 정도만 충당할 수 있어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T04:S02"}, {"test": 4, "part": 4, "sentence": "I am the longtime editor of renowned author Allen Short, and I have come here tonight to accept this award on his behalf.", "ref": "Part 4 Q74–76", "meaning": "저는 유명 작가 앨런 쇼트의 오랜 편집자이며, 오늘 그를 대신해 이 상을 받으러 왔습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T04:S03"}, {"test": 4, "part": 4, "sentence": "Be sure to set the dial on the second setting unless instructed otherwise.", "ref": "Part 4 Q80–82", "meaning": "별도의 지시가 없다면 다이얼을 두 번째 설정에 맞추세요.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T04:S04"}, {"test": 5, "part": 3, "sentence": "We’ve established a large client base in the neighborhood.", "ref": "Part 3 Q56–58", "meaning": "우리는 이 동네에 탄탄한 고객층을 확보했어요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T05:S01"}, {"test": 5, "part": 3, "sentence": "Partly, but also because we’re running a big promotion since we replaced some of our workout machines last month.", "ref": "Part 3 Q50–52", "meaning": "일부는 그렇지만, 지난달 운동 기구 일부를 교체한 뒤 대규모 판촉 행사를 진행 중인 이유도 있어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T05:S02"}, {"test": 5, "part": 4, "sentence": "The manufacturer of the product you selected—Wellington Paper Products—just went out of business.", "ref": "Part 4 Q71–73", "meaning": "선택하신 제품의 제조사인 웰링턴 페이퍼 프로덕츠가 최근 폐업했습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T05:S03"}, {"test": 5, "part": 4, "sentence": "As you know, it was originally planned for yesterday, but electricity in the building had to be temporarily cut off.", "ref": "Part 4 Q74–76", "meaning": "아시다시피 원래 어제로 예정되어 있었지만, 건물의 전기 공급을 일시적으로 중단해야 했습니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T05:S04"}, {"test": 6, "part": 3, "sentence": "If you don’t have plans, I’d like to treat you to lunch today.", "ref": "Part 3 Q32–34", "meaning": "계획이 없으시면 오늘 점심을 대접하고 싶어요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T06:S01"}, {"test": 6, "part": 3, "sentence": "Good morning, I’m wondering if you ever got around to unpacking the shipment of produce that our grocery store received from the farm.", "ref": "Part 3 Q35–37", "meaning": "좋은 아침이에요. 농장에서 우리 식료품점으로 온 농산물 배송분을 드디어 풀어 보셨는지 궁금해요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T06:S02"}, {"test": 6, "part": 4, "sentence": "Stop by Willis Tires this Saturday and Sunday to take advantage of our two-day sale.", "ref": "Part 4 Q71–73", "meaning": "이번 토요일과 일요일에 윌리스 타이어에 들러 이틀간의 세일 혜택을 이용하세요.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T06:S03"}, {"test": 6, "part": 4, "sentence": "The question now is whether to produce another limited edition or include this mix in our permanent product line.", "ref": "Part 4 Q77–79", "meaning": "이제 결정할 것은 다른 한정판을 만들지, 아니면 이 혼합 제품을 정규 제품군에 포함할지입니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T06:S04"}, {"test": 7, "part": 3, "sentence": "If they do, I suppose we’ll have to think of ways to encourage customers to buy our domestically produced goods.", "ref": "Part 3 Q32–34", "meaning": "그렇게 된다면 고객들이 우리의 국내 생산 제품을 구매하도록 유도할 방법을 생각해야겠어요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T07:S01"}, {"test": 7, "part": 3, "sentence": "Maybe the IT staff should consider switching back to our previous provider.", "ref": "Part 3 Q35–37", "meaning": "IT 직원들이 이전 서비스 제공업체로 다시 바꾸는 것을 고려해야 할 것 같아요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T07:S02"}, {"test": 7, "part": 4, "sentence": "This morning you’ll get to sample the menu items and provide feedback about the dishes, which we’ll begin serving on October 23.", "ref": "Part 4 Q71–73", "meaning": "오늘 아침에는 10월 23일부터 제공할 메뉴를 시식하고 음식에 대한 의견을 주실 수 있습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T07:S03"}, {"test": 7, "part": 4, "sentence": "We don’t offer this service for safety and liability reasons.", "ref": "Part 4 Q74–76", "meaning": "안전과 법적 책임 문제 때문에 이 서비스를 제공하지 않습니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T07:S04"}, {"test": 8, "part": 3, "sentence": "The sneakers our company released last month have been underperforming.", "ref": "Part 3 Q32–34", "meaning": "우리 회사가 지난달 출시한 운동화가 기대보다 실적이 저조해요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T08:S01"}, {"test": 8, "part": 3, "sentence": "Actually, I already looked up HomeRefresh online, but I can’t afford its high rates.", "ref": "Part 3 Q47–49", "meaning": "사실 홈리프레시를 이미 온라인으로 찾아봤지만, 높은 요금을 감당할 수 없어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T08:S02"}, {"test": 8, "part": 4, "sentence": "She’s going to tell us about the ceremony that’s been organized to mark the grand reopening.", "ref": "Part 4 Q71–73", "meaning": "그녀가 성대한 재개장을 기념하기 위해 마련된 행사에 대해 이야기할 예정입니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T08:S03"}, {"test": 8, "part": 4, "sentence": "The statue of Mr. Jean being unveiled was made by sculptor Janice Longoria, who is herself a huge fan of the pianist.", "ref": "Part 4 Q80–82", "meaning": "공개되는 진 씨의 동상은 그 피아니스트의 열렬한 팬인 조각가 재니스 롱고리아가 만들었습니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T08:S04"}, {"test": 9, "part": 3, "sentence": "Our department head wants me to recommend someone to take over the public relations team that Greg has been managing.", "ref": "Part 3 Q35–37", "meaning": "부서장은 그렉이 관리해 온 홍보팀을 맡을 사람을 제가 추천하기를 원해요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T09:S01"}, {"test": 9, "part": 3, "sentence": "I have a conference call at 3 p.m., but I can’t connect to the wireless Internet in my suite.", "ref": "Part 3 Q38–40", "meaning": "오후 3시에 전화 회의가 있는데, 제 객실에서 무선 인터넷에 연결할 수 없어요.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T09:S02"}, {"test": 9, "part": 4, "sentence": "I know that you all are still new to our firm’s accounting department and have yet to master our software for tracking travel reimbursements.", "ref": "Part 4 Q80–82", "meaning": "여러분이 아직 회계 부서의 신입이고 출장비 환급을 추적하는 소프트웨어를 숙달하지 못했다는 것을 압니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T09:S03"}, {"test": 9, "part": 4, "sentence": "The organization was founded last year to help people who move into our area settle in.", "ref": "Part 4 Q86–88", "meaning": "이 단체는 우리 지역으로 이사 오는 사람들이 적응하도록 돕기 위해 작년에 설립되었습니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T09:S04"}, {"test": 10, "part": 3, "sentence": "Yes, Nancy told me about that after she finished analyzing last quarter’s financial figures.", "ref": "Part 3 Q35–37", "meaning": "네, 낸시가 지난 분기의 재무 수치를 분석한 뒤 그 이야기를 해 줬어요.", "number": 1, "bookId": "toeic1000_1", "id": "toeic1000_1:T10:S01"}, {"test": 10, "part": 3, "sentence": "Please take a seat, and I’ll get a quote ready for you.", "ref": "Part 3 Q53–55", "meaning": "앉아 계시면 견적을 준비해 드리겠습니다.", "number": 2, "bookId": "toeic1000_1", "id": "toeic1000_1:T10:S02"}, {"test": 10, "part": 4, "sentence": "I’d like to let you know that your debit card may have been used by an unauthorized person.", "ref": "Part 4 Q98–100", "meaning": "권한이 없는 사람이 고객님의 직불카드를 사용했을 가능성이 있다는 점을 알려 드리고 싶습니다.", "number": 3, "bookId": "toeic1000_1", "id": "toeic1000_1:T10:S03"}, {"test": 10, "part": 4, "sentence": "What makes this item stand out is that it has no cord.", "ref": "Part 4 Q89–91", "meaning": "이 제품이 눈에 띄는 이유는 전선이 없다는 점입니다.", "number": 4, "bookId": "toeic1000_1", "id": "toeic1000_1:T10:S04"}]};let state={book:'toeic1000_1',test:1,part:3,mode:'expression',index:0};let records={};try{records=JSON.parse(localStorage.getItem('hannah_toeic_review_v1')||'{}')}catch(e){}const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bookName(){return DATA.books.find(b=>b.id===state.book).name}function list(){return state.mode==='sentence'?DATA.sentences.filter(x=>x.bookId===state.book&&x.test===state.test):DATA.expressions.filter(x=>x.bookId===state.book&&x.test===state.test&&x.part===state.part)}function chooseBook(id){const b=DATA.books.find(x=>x.id===id);if(b.status!=='ready'){$('pending').textContent=b.name+'의 복습 자료는 아직 준비되지 않았습니다. 1000제 1 자료와 별도로 관리합니다.';$('pending').classList.remove('hidden');return}state.book=id;$('pending').classList.add('hidden');grid()}function grid(){$('testgrid').innerHTML=DATA.books.find(b=>b.id===state.book).tests.map(t=>{const checked=DATA.expressions.filter(x=>x.test===t&&x.bookId===state.book&&records[x.id]).length;return `<div class="test"><h2>${esc(bookName())} · TEST ${String(t).padStart(2,'0')}</h2><button onclick="openSet(${t},3,'expression')">DAY ${t*2-1} · Part 1+3</button><button onclick="openSet(${t},4,'expression')">DAY ${t*2} · Part 2+4</button><button onclick="openSet(${t},3,'sentence')">문장 4개</button><small>Part 3 표현 10개 / Part 4 표현 10개<br>표현 복습 체크 <b>${checked}/20</b></small></div>`}).join('')}function openSet(t,p,m){state.test=t;state.part=p;state.mode=m;state.index=0;$('home').classList.add('hidden');$('viewer').classList.remove('hidden');$('jump').innerHTML=DATA.books.find(b=>b.id===state.book).tests.flatMap(t=>[3,4].map(p=>`<option value="${t},${p},expression">${esc(bookName())} · TEST ${String(t).padStart(2,'0')} · Part ${p===3?'1+3':'2+4'}</option>`).concat(`<option value="${t},3,sentence">${esc(bookName())} · TEST ${String(t).padStart(2,'0')} · 문장 4개</option>`)).join('');$('jump').value=`${t},${p},${m}`;render();window.scrollTo(0,0)}function jump(v){const [t,p,m]=v.split(',');openSet(+t,+p,m)}function render(){const a=list(),x=a[state.index];$('meta').textContent=`${bookName()} · TEST ${String(state.test).padStart(2,'0')} · ${state.mode==='sentence'?'문장 복습':`DAY ${state.part===3?state.test*2-1:state.test*2} / Part ${state.part===3?'1+3':'2+4'}`}`;$('expr').textContent=x.expression||x.sentence;$('count').textContent=`${state.index+1} / ${a.length}`;$('meaning').textContent=x.meaning;$('syn').textContent=x.synonym||'';$('note').textContent=x.note||'';$('source').textContent=x.sourceLabel||x.ref;$('hint').innerHTML=state.mode==='sentence'?'문장을 해석해 보세요.<br>핵심 표현을 덩어리로 떠올려 보세요.':'뜻을 떠올려 보세요.<br>같은 의미의 영어 표현도 말할 수 있나요?';$('answer').classList.add('hidden');$('hint').classList.remove('hidden');$('reveal').textContent=state.mode==='sentence'?'뜻 보기':'뜻·유사표현 보기';$('prev').disabled=state.index===0;$('next').disabled=state.index===a.length-1;$('mark').textContent=records[x.id]?'복습 완료 ✓':'복습 완료';$('mark').classList.toggle('done',!!records[x.id])}function reveal(){const hide=$('answer').classList.toggle('hidden');$('hint').classList.toggle('hidden',!hide);$('reveal').textContent=hide?(state.mode==='sentence'?'뜻 보기':'뜻·유사표현 보기'):'해설 숨기기'}function move(n){const v=state.index+n;if(v>=0&&v<list().length){state.index=v;render()}}function mark(){const x=list()[state.index];records[x.id]=!records[x.id];try{localStorage.setItem('hannah_toeic_review_v1',JSON.stringify(records))}catch(e){}$('mark').textContent=records[x.id]?'복습 완료 ✓':'복습 완료';$('mark').classList.toggle('done',!!records[x.id])}function goHome(){$('viewer').classList.add('hidden');$('home').classList.remove('hidden');grid();window.scrollTo(0,0)}document.addEventListener('keydown',e=>{if($('viewer').classList.contains('hidden')||['SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'||e.key==='Enter'){e.preventDefault();reveal()}else if(e.key==='Escape')goHome()});grid();
</script></body></html>
